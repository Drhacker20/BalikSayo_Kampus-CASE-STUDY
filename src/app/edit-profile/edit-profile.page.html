<ion-content class="ion-padding edit-profile-page">

  <style>
  /* === NEUMORPHIC EDIT PROFILE PAGE (White-Gray Theme) === */
  .edit-profile-page {
    --background: #ffffff !important;
    background: #ffffff !important;
    position: relative;
    min-height: 100vh;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    scroll-behavior: smooth;
  }

  /* === Curved Background === */
  .curved-bg {
     content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #eef2f6;
      z-index: -1;
  }

  /* 🟦 Neumorphic Back Button */
.back-btn {
  position: absolute;
  left: 5px;
  top: 15px;
  width: 60px;
  height: 60px;
  border-radius: 12px;
  background: #eef2f6;
  box-shadow:
    4px 4px 8px rgba(170, 180, 190, 0.5),
    -4px -4px 8px rgba(255, 255, 255, 0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.back-btn:hover {
  transform: translateY(-2px);
  box-shadow:
    2px 2px 6px rgba(163, 177, 198, 0.5),
    -2px -2px 6px rgba(255, 255, 255, 0.9);
}

.back-btn:active {
  transform: scale(0.95);
  box-shadow:
    inset 3px 3px 6px rgba(163, 177, 198, 0.6),
    inset -3px -3px 6px rgba(255, 255, 255, 0.9);
}

/* 🖼 Back icon itself */
.back-btn img {
  width: 22px;
  height: 22px;
  filter: drop-shadow(0 0 3px #00bfff);
}
  .edit-container {
    max-width: 380px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    text-align: center;
    padding: 30px 20px 50px 20px;
    position: relative;
    z-index: 1;
  }

  /* === Header Text === */
h2 {
  display: inline-block;
  padding: 8px 18px;
  font-weight: 700;
  font-size: 1.6rem;
  color: #00bfff;
  letter-spacing: 0.5px;
  background: #eef2f6;
  border-radius: 12px;
  box-shadow:
    inset 2px 2px 5px rgba(170, 180, 190, 0.5),
    inset -2px -2px 5px rgba(255, 255, 255, 0.8);
  text-shadow:
    2px 2px 4px rgba(163, 177, 198, 0.6),
    -2px -2px 4px rgba(255, 255, 255, 0.8);
  margin: 25px 0 20px 0;
  align-self: center; /* para naka-center sa container */
}

  /* === Profile Photo === */
  .profile-photo-container {
    position: relative;
    display: inline-block;
    width: 130px;
    height: 130px;
    margin: 0 auto 25px auto;
  }

  .profile-photo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #00e0ff;
    box-shadow:
      8px 8px 16px rgba(163,177,198,0.6),
      -8px -8px 16px rgba(255,255,255,0.9);
  }

  .upload-icon {
    position: absolute;
    bottom: 5px;
    right: 5px;
    background: linear-gradient(145deg, #f1f3f6, #d8dde3);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    border: none;
    box-shadow:
      4px 4px 8px rgba(163,177,198,0.5),
      -4px -4px 8px rgba(255,255,255,0.9);
    transition: all 0.3s ease;
  }

  .upload-icon:hover {
    transform: scale(1.1);
    box-shadow:
      2px 2px 6px rgba(163,177,198,0.4),
      -2px -2px 6px rgba(255,255,255,0.9);
  }

  .camera-icon {
    width: 20px;
    height: 20px;
    filter: drop-shadow(0 0 3px rgba(255,255,255,0.7));
    opacity: 0.85;
  }

  /* === Labels === */
  .field-label {
    text-align: left;
    margin: 0 0 5px 5px;
    font-weight: 600;
    color: #777;
  }

  /* === Input Fields === */
  .input-item {
    border-radius: 14px;
    margin-bottom: 15px;
    background: #e6e9ef !important;
    box-shadow:
      inset 5px 5px 10px rgba(163,177,198,0.7),
      inset -5px -5px 10px rgba(255,255,255,0.95);
    border: none !important;
    color: #333;
    padding: 4px;
  }

  .input-item.ion-focused {
    box-shadow:
      inset 3px 3px 6px rgba(163,177,198,0.6),
      inset -3px -3px 6px rgba(255,255,255,1);
    filter: brightness(1.03);
  }

  ion-input {
    color: #333;
    --placeholder-color: #00bfff;
  }

  ion-icon {
    color: #00bfff;
  }

  .joined-text b{
    color: #00bfff
  }

  /* === Buttons === */
 ion-button.edit-btn {
  --background: transparent !important; /* remove Ionic default background */
  width: 100%;
  height: 55px;
  border-radius: 9999px !important;
  margin-top: 10px;
  font-weight: 700;
  color: #fff !important;
  letter-spacing: 1px;
  background: linear-gradient(145deg, #00e0ff, #0095ff) !important;
  border: none !important;
  box-shadow:
    0 0 14px rgba(0, 191, 255, 0.9),
    6px 6px 12px rgba(0, 143, 191, 0.4),
    -6px -6px 12px rgba(255, 255, 255, 0.9);
  text-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
  transition: all 0.25s ease-in-out;
}

ion-button.edit-btn:hover {
  filter: brightness(1.18);
  transform: translateY(-2px);
  box-shadow:
    0 0 18px rgb(0, 191, 255),
    4px 4px 8px rgba(0, 143, 191, 0.4),
    -4px -4px 8px rgba(255, 255, 255, 0.95);
}

ion-button.edit-btn:active {
  box-shadow:
    inset 3px 3px 6px rgba(0, 143, 191, 0.5),
    inset -3px -3px 6px rgba(255, 255, 255, 0.8);
  transform: translateY(1px);
  filter: brightness(0.95);
}


  .delete-btn {
 
     background: linear-gradient(145deg, #ff6b6b, #e63946);
    color: #fff;
    border: none;
    border-radius: 25px;
    padding: 12px;
    font-size: 15px;
    width: 60%;
    margin: 20px auto 0 auto;
    cursor: pointer;
    font-weight: 600;
    box-shadow:
        6px 6px 12px rgba(200, 50, 50, 0.4),
        -6px -6px 12px rgba(255, 180, 180, 0.9);
    transition: 0.3s;
    cursor: pointer;
  }

  .delete-btn:hover {
   transform: translateY(-2px);
      filter: brightness(1.1);
  }

  .delete-btn:active {
      box-shadow:
        inset 4px 4px 8px rgba(200, 50, 50, 0.5),
        inset -4px -4px 8px rgba(255, 180, 180, 0.8);
      transform: translateY(1px);
    }

  /* Remove the white overlay from Ion Item */
ion-item.input-item::part(native) {
  background: transparent !important;
  box-shadow: none !important;
}

/* Make sure the inner input background is transparent too */
ion-input {
  --background: transparent !important;
  background: transparent !important;
}

/* Remove default background for ion-button */
ion-button.edit-btn::part(native) {
  background: transparent !important;
  box-shadow: none !important;
}

/* === Select (Role Dropdown) === */
ion-select {
  --background: transparent;
  color: #333;
  font-size: 14px;
  --placeholder-color: #333 !important; /* neon blue placeholder */
}

ion-select::part(placeholder) {
  color: #222;

}

ion-select::part(icon) {
  color: #00bfff;
}


  </style>

  <div class="curved-bg"></div>

   <div class="edit-container">
    <div class="back-btn" (click)="goBack()">
      <img src="assets/back.png" alt="Back" />
    </div>

    <h2>Edit Profile</h2>

    <!-- Profile Photo -->
    <div class="profile-photo-container">
      <img
        [src]="sanitizedProfileImage"
        alt="Profile Photo"
        class="profile-photo"
        id="profilePreview"
      />
      <div class="upload-icon" (click)="openFilePicker()">
        <img src="assets/icon/camera.png" alt="Upload Icon" class="camera-icon" />
      </div>
      <input
        type="file"
        id="fileInput"
        hidden
        accept="image/*"
        (change)="onFileSelected($event)"
      />
    </div>

    <!-- FORM -->
    <form>
      <p class="field-label">First Name</p>
      <ion-item class="input-item">
        <ion-icon slot="start" name="person-outline"></ion-icon>
        <ion-input type="text" [(ngModel)]="firstName" name="firstName"></ion-input>
      </ion-item>

      <p class="field-label">Last Name</p>
      <ion-item class="input-item">
        <ion-icon slot="start" name="person-outline"></ion-icon>
        <ion-input type="text" [(ngModel)]="lastName" name="lastName"></ion-input>
      </ion-item>

      <p class="field-label">Email</p>
      <ion-item class="input-item">
        <ion-icon slot="start" name="mail-outline"></ion-icon>
        <ion-input type="email" [(ngModel)]="email" name="email"></ion-input>
      </ion-item>

      <p class="field-label">Role</p>
      <ion-item class="input-item">
        <ion-icon slot="start" name="briefcase-outline"></ion-icon>
        <ion-select interface="popover" [(ngModel)]="role" name="role">
          <ion-select-option value="teacher">Teacher</ion-select-option>
          <ion-select-option value="student">Student</ion-select-option>
          <ion-select-option value="guard">Guard</ion-select-option>
          <ion-select-option value="janitor">Janitor</ion-select-option>
        </ion-select>
      </ion-item>

      <p class="field-label">Password</p>
      <ion-item class="input-item">
        <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
        <ion-input [type]="passwordType1" [(ngModel)]="password1" name="password1"></ion-input>
        <ion-icon slot="end" name="eye-outline" (click)="togglePassword(1)"></ion-icon>
      </ion-item>

      <p class="field-label">Confirm Password</p>
      <ion-item class="input-item">
        <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
        <ion-input [type]="passwordType2" [(ngModel)]="password2" name="password2"></ion-input>
        <ion-icon slot="end" name="eye-outline" (click)="togglePassword(2)"></ion-icon>
      </ion-item>

      <ion-button expand="block" class="edit-btn" (click)="saveProfile()">EDIT PROFILE</ion-button>

      <div class="joined-text">Joined <b>{{ joined }}</b></div>

      <button type="button" class="delete-btn" (click)="deleteProfile()">Delete</button>
    </form>
  </div>
</ion-content>
