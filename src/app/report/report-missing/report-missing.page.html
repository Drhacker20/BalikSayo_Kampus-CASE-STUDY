<!-- ✅ CLEAN HEADER -->
<ion-header class="no-header-box">
  <div class="header-container">
    <h1 class="page-title">Report Lost Items</h1>
  </div>
</ion-header>

<ion-content class="glass-content">

  <!-- Segment Tabs -->
  <div class="custom-segment">
    <button [class.active]="selectedSegment === 'unclaimed'" (click)="setSegment('unclaimed')">Unclaimed</button>
    <button [class.active]="selectedSegment === 'claimed'" (click)="setSegment('claimed')">Claimed</button>
    <div class="indicator" [class.pos1]="selectedSegment==='unclaimed'" [class.pos2]="selectedSegment==='claimed'"></div>
  </div>

  <!-- List of Items -->
  <div *ngIf="filteredItems.length; else noResults">
    <div *ngFor="let item of filteredItems" class="list-card" (click)="openItemDetails(item)">
      <img [src]="item.image || 'assets/sample-item.png'" alt="item image" />
      <div class="info">
        <h4>{{ item.name }}</h4>
        <p><ion-icon name="location-outline"></ion-icon> {{ item.location }}</p>
        <span>{{ item.daysAgo === 0 ? 'Today' : item.daysAgo + ' day(s) ago' }}</span>
      </div>
      <!-- Edit / Remove Icons -->
      <div class="actions" (click)="$event.stopPropagation()"> <!-- stopPropagation to prevent parent click -->
        <ion-icon name="create-outline" (click)="editItem(item)"></ion-icon>
        <ion-icon name="trash-outline" (click)="removeItem(item)"></ion-icon>
      </div>
    </div>
  </div>

  <!-- No Results Found -->
  <ng-template #noResults>
    <div class="no-results">
      <ion-icon name="search-outline"></ion-icon>
      <p>No records found</p>
    </div>
  </ng-template>

  <!-- 🟦 Floating Add Button -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="fab-container">
    <ion-fab-button class="glass-fab" [routerLink]="['/add-missing']">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>


<style>
/* ===== 🧊 GLOBAL CONTENT (same as home) ===== */
ion-content.glass-content {
  --background: #eef2f6;
  position: relative;
  overflow: hidden;
  padding-bottom: 20px;
  display: flex;
  flex-direction: column;
}

/* Single-layer clean background (no double overlay) */
ion-content.glass-content::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #eef2f6;
  z-index: -1;
}

/* ===== HEADER (same neumorphic background) ===== */
.no-header-box {
  background: transparent !important;
  box-shadow: none !important;
  border: none !important;
}

.header-container {
  display: flex;
  justify-content: left; /* center title */
  align-items: center;
  padding: 20px 0 10px;
  background: #eef2f6;
}


.page-title {
  display: inline-block; /* ✅ so the box fits the text */
  padding: 8px 10px; /* soft spacing around the title */
  font-weight: 700;
  font-size: 1.6rem;
  color: #00bfff;
  letter-spacing: 0.5px;
  background: #eef2f6;
  border-radius: 12px;
  box-shadow:
    inset 2px 2px 5px rgba(170, 180, 190, 0.5),
    inset -2px -2px 5px rgba(255, 255, 255, 0.8);
  text-shadow:
    2px 2px 4px rgba(163, 177, 198, 0.6),
    -2px -2px 4px rgba(255, 255, 255, 0.8);
  margin: 15px 0 10px 15px;
}

.actions {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  margin-left: auto;
  padding-right: 10px;
}

.actions ion-icon {
  font-size: 22px;
  color: #00bfff;
  cursor: pointer;
  transition: 0.2s;
}

.actions ion-icon:hover {
  color: #0077aa;
  transform: scale(1.2);
}


/* ===== CUSTOM SEGMENT ===== */
.custom-segment {
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin: 12px 10px;
  padding: 8px;
  border-radius: 25px;
  background: #eef2f6;
  box-shadow:
    inset 2px 2px 4px rgba(170, 180, 190, 0.3),
    inset -2px -2px 4px rgba(255, 255, 255, 0.9);
  position: relative;
  border: 1px solid rgba(255, 255, 255, 0.4);
}

.custom-segment button {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 15px;
  color: #666;
  font-weight: 500;
  transition: 0.3s;
}

.custom-segment button.active {
   color: #00bfff;
  font-weight: 600;
  text-shadow: 0 0 5px rgba(0, 191, 255, 0.4);
}

.indicator {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 50%;
  height: 3px;
  background: #00bfff;
  border-radius: 6px;
  transition: transform 0.3s ease-in-out;
}

.pos1 { transform: translateX(0%); }
.pos2 { transform: translateX(100%); }

/* ===== ITEM CARDS ===== */
.list-card {
  display: flex;
  align-items: center;
  padding: 10px;
  margin: 10px 15px;
  border-radius: 20px;
  background: #eef2f6;
  box-shadow:
    6px 6px 12px rgba(170, 180, 190, 0.5),
    -6px -6px 12px rgba(255, 255, 255, 0.9);
}

.list-card img {
  width: 60px;
  height: 60px;
  border-radius: 15px;
  object-fit: cover;
  margin-right: 12px;
  box-shadow:
    inset 2px 2px 4px rgba(170, 180, 190, 0.5),
    inset -2px -2px 4px rgba(255, 255, 255, 0.8);
}

.info h4 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: #2f2f2f;
}

.info p {
  margin: 2px 0;
  font-size: 13px;
  color: #555;
}

.info span {
  font-size: 12px;
  color: #8c96a5;
}

/* ===== NO RESULTS ===== */
.no-results {
  text-align: center;
  color: #444;
  margin: 40px 20px;
  padding: 20px;
  border-radius: 20px;
  background: #eef2f6;
  box-shadow:
    inset 5px 5px 10px rgba(170, 180, 190, 0.5),
    inset -5px -5px 10px rgba(255, 255, 255, 0.8);
}

.no-results ion-icon {
  font-size: 40px;
  color: #8c96a5;
  opacity: 0.9;
}

/* ===== FLOATING ADD BUTTON ===== */
.fab-container {
  position: fixed;
  bottom: 280px;
  right: 20px;
  z-index: 999;
}

.glass-fab {
  --background: linear-gradient(145deg, #ffffff, #e2e8f0);
  --box-shadow:
    6px 6px 12px rgba(150, 160, 170, 0.4),
    -6px -6px 12px rgba(255, 255, 255, 0.9);
  color: #2f2f2f;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  transition: 0.25s ease;
}

.glass-fab ion-icon {
  font-size: 38px;
  color: #00bfff; 
}

.glass-fab:active {
  transform: scale(0.92);
  box-shadow:
    inset 4px 4px 8px rgba(150, 160, 170, 0.4),
    inset -4px -4px 8px rgba(255, 255, 255, 0.9);
}

.glass-fab:hover {
  transform: scale(1.05);
}

</style>
