<ion-header translucent="true" class="no-header-box">
  <div class="header-container">
    <div class="back-btn" (click)="goBack()">
      <img src="assets/back.png" alt="Back" />
    </div>
    <h1 class="page-title">Report a Lost Item</h1>
  </div>
</ion-header>

<ion-content class="add-missing-page">
  <div class="form-container">

    <!-- 🟦 Item Name -->
    <ion-label class="field-label">Item Name</ion-label>
    <ion-input class="input-item" [(ngModel)]="itemName" placeholder="Enter item name"></ion-input>

    <!-- 🟦 Type Dropdown -->
    <ion-label class="field-label">Type</ion-label>
    <ion-select
      class="input-item select-box"
      [(ngModel)]="selectedType"
      placeholder="Select Type"
      (ionChange)="onTypeChange()"
    >
      <ion-select-option value="electronics">Electronics</ion-select-option>
      <ion-select-option value="jewelry">Jewelry</ion-select-option>
      <ion-select-option value="keys">Keys</ion-select-option>
      <ion-select-option value="clothing">Clothing</ion-select-option>
      <ion-select-option value="others">Others</ion-select-option>
    </ion-select>

    <!-- 🟢 Show only if “Others” is selected -->
    <div *ngIf="selectedType === 'others'">
      <ion-input
        class="input-item"
        [(ngModel)]="otherType"
        placeholder="Enter item type"
      ></ion-input>
    </div>

    <!-- 🟦 Location Dropdown -->
    <ion-label class="field-label">Location</ion-label>
    <ion-select
      class="input-item select-box"
      [(ngModel)]="selectedLocation"
      placeholder="Select Location"
      (ionChange)="onLocationChange()"
    >
      <ion-select-option value="CICT Building">CICT Building</ion-select-option>
      <ion-select-option value="CMBT Building">CMBT Building</ion-select-option>
      <ion-select-option value="RET Building">RET Building</ion-select-option>
      <ion-select-option value="Student Center">Student Center</ion-select-option>
      <ion-select-option value="Gymnasium">Gymnasium</ion-select-option>
      <ion-select-option value="Library">Library</ion-select-option>
      <ion-select-option value="Parking Lot">Parking Lot</ion-select-option>
      <ion-select-option value="others">Others</ion-select-option>
    </ion-select>

    <!-- 🟢 Show textfield if “Others” selected -->
    <div *ngIf="selectedLocation === 'others'">
      <ion-input
        class="input-item"
        [(ngModel)]="otherLocation"
        placeholder="Enter location"
      ></ion-input>
    </div>

    

    <!-- 🕒 Time Picker -->
    <ion-label class="field-label">Time</ion-label>
    <div class="time-box" (click)="togglePicker()">
      <ion-icon name="calendar-outline"></ion-icon>
      <span>{{ formattedDate }} {{ formattedTime }}</span>
    </div>

    <div *ngIf="showPicker" class="inline-picker">
      <ion-datetime
  presentation="date-time"
  [(ngModel)]="selectedDateTime"
  (ionChange)="updateDateTime()"
  [max]="maxDateTime">
</ion-datetime>

      <ion-button expand="block" class="done-btn" (click)="closePicker()">Done</ion-button>
    </div>

    <!-- 🟦 Description -->
<ion-label class="field-label">Description</ion-label>
<ion-textarea
  class="input-item description-box"
  [(ngModel)]="description"
  placeholder="Enter a brief description of the item"
  autoGrow="true">
</ion-textarea>


<!-- 📸 Photo Upload -->
<ion-label class="field-label">Photo</ion-label>
<div class="photo-box" (click)="triggerFileInput()">
  <img [src]="photo || 'assets/sample-item.png'" />
</div>

<input type="file" accept="image/*" #fileInput (change)="onFileSelected($event)" hidden />
<ion-button fill="clear" class="change-photo" (click)="triggerFileInput()">Change Photo</ion-button>


    <!-- 🔘 Buttons -->
    <div class="button-row">
      <ion-button expand="block" class="cancel-btn" color="light" (click)="cancel()">Clear</ion-button>
      <ion-button expand="block" class="submit-btn" (click)="submit()">Submit</ion-button>
    </div>

  </div>
</ion-content>
