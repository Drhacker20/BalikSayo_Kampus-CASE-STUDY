<ion-content class="ion-padding profile-page">
  <style>
    /* === NEUMORPHIC PROFILE PAGE (White-Gray Theme) === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    .profile-page {
      --background: #ffffff !important;
      background: #ffffff !important;
      position: relative;
      min-height: 100vh;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .curved-bg {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #eef2f6;
      z-index: -1;
    }

    .profile-container {
      max-width: 380px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      text-align: center;
      padding: 40px 20px 50px 20px;
      position: relative;
      z-index: 1;
    }

    /* === Profile Section === */
    .profile-section {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 40px;
    }

    .profile-pic {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00e0ff;
      box-shadow:
        8px 8px 16px rgba(163, 177, 198, 0.6),
        -8px -8px 16px rgba(255, 255, 255, 0.9),
        0 0 12px rgba(0, 191, 255, 0.3);
      margin-bottom: 12px;
    }

    .joined {
      color: #444;
      font-size: 13px;
    }

    .user-name {
      font-size: 27px;
      font-weight: 700;
      color: #444;
      margin-top: 8px;
    }

    /* === Section Titles === */
    .section-title {
      width: 100%;
      max-width: 400px;
      color: #555;
      font-weight: 600;
      font-size: 15px;
      text-transform: uppercase;
      margin-bottom: 5px;
      text-align: left;
    }

    /* === List Container === */
    .list-container {
      width: 100%;
      max-width: 400px;
      background: #e6e9ef;
      border-radius: 16px;
      box-shadow:
        5px 5px 10px rgba(163, 177, 198, 0.6),
        -5px -5px 10px rgba(255, 255, 255, 0.9);
      padding: 5px 0;
      margin-bottom: 20px;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.4);
      transition: 0.2s;
      cursor: default;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
    }

    .list-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .list-left > div {
      text-align: left;
    }

    .list-icon {
  background: linear-gradient(145deg, #f1f3f6, #d8dde3);
  border-radius: 12px;
  width: 42px;
  height: 42px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #00bfff; /* 🌊 Deep Sky Blue icons */
  font-size: 20px;
  box-shadow:
    4px 4px 8px rgba(163,177,198,0.5),
    -4px -4px 8px rgba(255,255,255,0.8);
}


    .list-text {
      font-size: 16px;
      color: #333;
      font-weight: 500;
      display: block;
    }

    .list-value {
      font-size: 15px;
      color: #777;
      font-weight: 400;
      display: block;
      margin-top: 2px;
    }

    /* === Edit Profile Arrow (blue color) === */
    .arrow-icon {
      color: #00bfff;
      font-size: 18px;
      transition: 0.25s;
    }

    /* === Highlight effect for Edit Profile === */
    .editable:hover,
    .editable.active {
      background: #dff5ff;
      box-shadow:
        inset 3px 3px 6px rgba(163, 177, 198, 0.4),
        inset -3px -3px 6px rgba(255, 255, 255, 0.8);
      transform: scale(0.99);
      transition: all 0.25s ease;
    }

    /* === Toggle === */
    .toggle-switch {
      position: relative;
      width: 45px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #c7ccd4;
      border-radius: 24px;
      transition: 0.3s;
      box-shadow:
        inset 3px 3px 6px rgba(163,177,198,0.5),
        inset -3px -3px 6px rgba(255,255,255,0.8);
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.3s;
      box-shadow:
        2px 2px 4px rgba(163,177,198,0.6),
        -2px -2px 4px rgba(255,255,255,0.8);
    }

    input:checked + .slider {
      background-color: #4b8df8;
    }

    input:checked + .slider::before {
      transform: translateX(21px);
    }

    /* === Sign Out Button (Red Neumorphic) === */
    .signout-btn {
      margin-top: 40px;
      width: 80%;
      max-width: 200px;
      height: 50px;
      margin: 40px auto 0 auto;
      border-radius: 9999px;
      background: linear-gradient(145deg, #ff6b6b, #e63946);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow:
        6px 6px 12px rgba(200, 50, 50, 0.4),
        -6px -6px 12px rgba(255, 180, 180, 0.9);
      border: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .signout-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .signout-btn:active {
      box-shadow:
        inset 4px 4px 8px rgba(200, 50, 50, 0.5),
        inset -4px -4px 8px rgba(255, 180, 180, 0.8);
      transform: translateY(1px);
    }

  .editable.active {
  background: rgba(0, 191, 255, 0.15); /* soft blue flash */
  box-shadow:
    inset 4px 4px 8px rgba(0, 191, 255, 0.3),
    inset -4px -4px 8px rgba(255, 255, 255, 0.8);
  transition: all 0.15s ease;
  transform: scale(0.98);
}


  </style>

  <div class="profile-container">
   <div class="profile-section">
  <img [src]="profileImage" alt="Profile Picture" class="profile-pic" id="profilePreview">
  <p class="joined">Joined <b>{{ joined }}</b></p>
  <h2 class="user-name">{{ userName }}</h2>
</div>

    <div class="section-title">Profile</div>
    <div class="list-container">
     <div class="list-item">
  <div class="list-left">
    <div class="list-icon"><ion-icon name="mail-outline"></ion-icon></div>
    <div>
      <span class="list-text">Email</span>
      <span class="list-value">{{ email }}</span>
    </div>
  </div>
</div>

      <div class="list-item">
        <div class="list-left">
          <div class="list-icon"><ion-icon name="lock-closed-outline"></ion-icon></div>
          <div>
            <span class="list-text">Password</span>
            <span class="list-value">••••••••••</span>
          </div>
        </div>
      </div>
    </div>

    <div class="section-title">Settings</div>
    <div class="list-container">
      <div class="list-item editable" routerLink="/edit-profile" id="editProfile">
        <div class="list-left">
          <div class="list-icon"><ion-icon name="create-outline"></ion-icon></div>
          <span class="list-text">Edit Profile</span>
        </div>
        <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
      </div>

      <div class="list-item">
        <div class="list-left">
          <div class="list-icon"><ion-icon name="moon-outline"></ion-icon></div>
          <span class="list-text">Dark Mode</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="darkModeToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

   <button class="signout-btn" (click)="signOutUser()">Sign Out</button>

  </div>

  <div class="curved-bg"></div>

  <script>
    // === Highlight effect for both desktop & mobile ===
const editProfile = document.getElementById("editProfile");
if (editProfile) {
  const activate = () => editProfile.classList.add("active");
  const deactivate = () => setTimeout(() => editProfile.classList.remove("active"), 150);

  // 🖱️ Desktop events
  editProfile.addEventListener("mousedown", activate);
  editProfile.addEventListener("mouseup", deactivate);
  editProfile.addEventListener("mouseleave", deactivate);

  // 📱 Mobile touch events
  editProfile.addEventListener("touchstart", activate);
  editProfile.addEventListener("touchend", deactivate);
  editProfile.addEventListener("touchcancel", deactivate);
}


  </script>
</ion-content>
